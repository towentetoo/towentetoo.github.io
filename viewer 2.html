<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Просмотр</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --paper: #f6f4ef;
    --ink: #1f1d1a;
    --line: #d8d3c7;
    --accent: #7a5c3e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #2b2925;
    color: var(--ink);
    font-family: -apple-system, sans-serif;
    overflow: hidden;
  }
  #toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 52px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0.75rem;
    z-index: 10;
    gap: 0.5rem;
  }
  #toolbar .left, #toolbar .right {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  #toolbar a, #toolbar button {
    background: none;
    border: none;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.95rem;
    padding: 0.4rem 0.55rem;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
  }
  #toolbar button:active, #toolbar a:active { background: var(--line); }
  #toolbar button:disabled { opacity: 0.35; }
  #page-indicator {
    font-variant-numeric: tabular-nums;
    min-width: 4.5rem;
    text-align: center;
  }
  #viewport {
    position: absolute;
    top: 52px; left: 0; right: 0; bottom: 0;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    background: #2b2925;
    display: flex;
    justify-content: center;
  }
  #page-canvas {
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    margin: 1rem 0;
    touch-action: pan-y pinch-zoom;
    max-width: 100%;
    height: auto;
  }
  #status {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #cfc9ba;
    font-size: 0.95rem;
    background: #2b2925;
  }
</style>
</head>
<body>

<div id="toolbar">
  <div class="left">
    <a href="index.html">← назад</a>
  </div>
  <div class="right">
    <button id="zoom-out">−</button>
    <button id="zoom-in">+</button>
    <button id="prev">‹</button>
    <span id="page-indicator">…</span>
    <button id="next">›</button>
    <button id="fullscreen">⤢</button>
  </div>
</div>

<div id="viewport">
  <canvas id="page-canvas"></canvas>
</div>
<div id="status">Загрузка…</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const params = new URLSearchParams(window.location.search);
const fileName = params.get('file');
const statusEl = document.getElementById('status');

if (!fileName) {
  statusEl.textContent = 'Файл не указан.';
} else {
  document.title = fileName;

  let pdfDoc = null;
  let pageNum = 1;
  let scale = 1.0;
  const baseScale = window.devicePixelRatio > 1 ? window.devicePixelRatio : 1;
  const canvas = document.getElementById('page-canvas');
  const ctx = canvas.getContext('2d');
  const indicator = document.getElementById('page-indicator');
  const viewport = document.getElementById('viewport');

  function renderPage(num) {
    pdfDoc.getPage(num).then(page => {
      const containerWidth = viewport.clientWidth - 32;
      const unscaled = page.getViewport({ scale: 1 });
      const fitScale = (containerWidth / unscaled.width) * scale;
      const renderViewport = page.getViewport({ scale: fitScale * baseScale });

      canvas.width = renderViewport.width;
      canvas.height = renderViewport.height;
      canvas.style.width = (renderViewport.width / baseScale) + 'px';
      canvas.style.height = (renderViewport.height / baseScale) + 'px';

      page.render({ canvasContext: ctx, viewport: renderViewport });
      indicator.textContent = num + ' / ' + pdfDoc.numPages;
      document.getElementById('prev').disabled = num <= 1;
      document.getElementById('next').disabled = num >= pdfDoc.numPages;
    });
  }

  pdfjsLib.getDocument(fileName).promise.then(doc => {
    pdfDoc = doc;
    statusEl.style.display = 'none';
    renderPage(pageNum);
  }).catch(err => {
    statusEl.textContent = 'Не удалось открыть файл.';
  });

  document.getElementById('prev').addEventListener('click', () => {
    if (pageNum > 1) { pageNum--; renderPage(pageNum); }
  });
  document.getElementById('next').addEventListener('click', () => {
    if (pdfDoc && pageNum < pdfDoc.numPages) { pageNum++; renderPage(pageNum); }
  });
  document.getElementById('zoom-in').addEventListener('click', () => {
    scale = Math.min(scale + 0.2, 3);
    if (pdfDoc) renderPage(pageNum);
  });
  document.getElementById('zoom-out').addEventListener('click', () => {
    scale = Math.max(scale - 0.2, 0.4);
    if (pdfDoc) renderPage(pageNum);
  });
  document.getElementById('fullscreen').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  });

  let touchStartX = null;
  viewport.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
  viewport.addEventListener('touchend', e => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 60) {
      if (dx < 0 && pdfDoc && pageNum < pdfDoc.numPages) { pageNum++; renderPage(pageNum); }
      else if (dx > 0 && pageNum > 1) { pageNum--; renderPage(pageNum); }
    }
    touchStartX = null;
  }, { passive: true });

  window.addEventListener('resize', () => { if (pdfDoc) renderPage(pageNum); });
}
</script>

</body>
</html>
