<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Пасьянсы — Косынка и Паук</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script>window.__TC_PLATFORM="vk"</script>
<script src="vk-bridge.min.js"></script>
<script src="platform.js"></script>
</head>
<body oncontextmenu="return false">
<canvas id="c"></canvas>
<div class="bar" id="bar">
  <div class="stat"><small data-t="moves">Ходы</small><b id="moves">0</b></div>
  <div class="stat"><small data-t="time">Время</small><b id="time">0:00</b></div>
  <div class="sp"></div>
  <button class="tb" id="bUndo" data-t="undo">↶ Отмена</button>
  <button class="tb" id="bHint" aria-label="Подсказка">💡<span class="cnt" id="nHint">3</span></button>
  <button class="tb ico" id="bPause" aria-label="Пауза"><i class="pz"></i></button>
</div>
<button class="auto hide" id="bAuto" data-t="collect">Собрать карты</button>
<div class="dealing hide" id="dealing"><span data-t="dealing">Тасую колоду…</span></div>

<div class="ov menu" id="ovBoot">
  <div class="panel"><div class="spinner"></div><p id="bootMsg"></p><button class="btn hide" id="bRetry"></button></div>
</div>

<div class="ov menu hide" id="ovMenu">
  <div class="panel wide">
    <button class="snd" id="bSound" aria-label="Звук">🔊</button>
    <div class="mstars" id="menuStars">★ 0</div>
    <canvas class="hero" id="menuArt" width="420" height="230"></canvas>
    <h1 data-t="title">Пасьянсы</h1>
    <div class="sub" data-t="sub">Косынка и Паук</div>
    <button class="btn cont hide" id="bCont"></button>
    <button class="btn gold" id="bDaily"></button>
    <div class="modes">
      <div class="mcol">
        <div class="mh">♠ ♥</div>
        <button class="btn" data-mode="klon1" data-t="klon1"></button>
        <button class="btn" data-mode="klon3" data-t="klon3"></button>
      </div>
      <div class="mcol">
        <div class="mh">🕷</div>
        <button class="btn sp" data-mode="sp1" data-t="sp1"></button>
        <button class="btn sp" data-mode="sp2" data-t="sp2"></button>
        <button class="btn sp" data-mode="sp4" data-t="sp4"></button>
      </div>
    </div>
    <p class="note" data-t="solvableNote"></p>
    <div class="row">
      <button class="btn ghost" id="bStats" data-t="stats"></button>
      <button class="btn ghost" id="bThemes" data-t="themes"></button>
      <button class="btn ghost" id="bBoard" data-t="board"></button>
    </div>
    <p class="how" data-t="how"></p>
    <button class="link" id="bLegal" data-t="legalBtn"></button>
    <div class="studio">T&amp;C STUDIO · <b class="age">0+</b></div>
  </div>
</div>

<div class="ov hide" id="ovPause">
  <div class="panel">
    <h2 data-t="pause"></h2>
    <button class="btn" id="bResume" data-t="resume"></button>
    <div class="row">
      <button class="btn ghost" id="bSfx"></button>
      <button class="btn ghost" id="bMus"></button>
    </div>
    <button class="btn ghost" id="bNewGame" data-t="newGame"></button>
    <button class="btn ghost" id="bMenu" data-t="menu"></button>
  </div>
</div>

<div class="ov hide" id="ovWin">
  <div class="panel">
    <div class="crown">♛</div>
    <h2 data-t="win"></h2>
    <p id="winText"></p>
    <button class="btn gold" id="bDouble"><span>📺</span> <span data-t="double"></span></button>
    <button class="btn" id="bAgain" data-t="again"></button>
    <button class="btn ghost" id="bWinMenu" data-t="toMenu"></button>
  </div>
</div>

<div class="ov hide" id="ovOffer">
  <div class="panel">
    <h2 data-t="hintT"></h2>
    <p data-t="hintX"></p>
    <button class="btn gold" id="bOfferAd"><span>📺</span> <span data-t="hintB"></span></button>
    <button class="btn ghost" data-back data-t="cancel"></button>
  </div>
</div>

<div class="ov hide" id="ovStats">
  <div class="panel wide">
    <h2 data-t="statsT"></h2>
    <div class="stats" id="statsBox"></div>
    <button class="btn ghost" data-back data-t="backB"></button>
  </div>
</div>

<div class="ov hide" id="ovThemes">
  <div class="panel wide">
    <h2 data-t="themesT"></h2>
    <div class="mstars static">★ <b id="thStars">0</b></div>
    <h3 data-t="felt"></h3>
    <div class="ths" id="thFelt"></div>
    <h3 data-t="back"></h3>
    <div class="ths" id="thBack"></div>
    <button class="btn ghost" data-back data-t="backB"></button>
  </div>
</div>

<div class="ov hide" id="ovBoard">
  <div class="panel wide">
    <h2 data-t="board"></h2>
    <ol class="board" id="boardList"></ol>
    <p class="meta" id="boardMsg"></p>
    <button class="btn gold hide" id="bAuth" data-t="login"></button>
    <button class="btn ghost" data-back data-t="backB"></button>
  </div>
</div>

<div class="ov hide" id="ovLegal">
  <div class="panel wide">
    <div class="legal" id="legalText"></div>
    <button class="btn ghost" data-back data-t="backB"></button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="cards.js"></script>
<script src="solver.js"></script>
<script src="music.js"></script>
<script src="game.js"></script>
</body>
</html>
